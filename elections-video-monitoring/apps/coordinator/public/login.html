<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Election Monitor — Login</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, sans-serif;
  background: #0d0d0d;
  color: #e0e0e0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-card {
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
  padding: 32px;
  width: 100%;
  max-width: 380px;
  margin: 16px;
}

.login-card h1 {
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 4px;
}

.login-card p {
  font-size: 13px;
  color: #888;
  margin-bottom: 24px;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: #888;
  margin-bottom: 4px;
}

input[type="text"],
input[type="password"] {
  width: 100%;
  padding: 10px 12px;
  background: #111;
  border: 1px solid #333;
  border-radius: 4px;
  color: #e0e0e0;
  font-size: 16px; /* 16px or iOS zooms the page on focus */
  min-height: 44px;
  font-family: system-ui, sans-serif;
  margin-bottom: 16px;
}

input[type="text"]:focus,
input[type="password"]:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35);
}

button[type="submit"] {
  width: 100%;
  padding: 10px 16px;
  background: #2563eb;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  font-family: system-ui, sans-serif;
}

button[type="submit"]:hover {
  background: #1d4ed8;
}

button[type="submit"]:focus-visible {
  outline: 2px solid #60a5fa;
  outline-offset: 2px;
}

button[type="submit"]:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* Phones and short screens: top-align and tighten the card, so the Sign in
 * button stays above an on-screen keyboard even when the browser overlays the
 * keyboard instead of resizing the page (iOS Safari). */
@media (max-height: 640px), (max-width: 500px) {
  body { align-items: flex-start; }
  .login-card { padding: 16px 20px; margin: 12px 16px; }
  .login-card p { margin-bottom: 12px; }
  input[type="text"], input[type="password"] { padding: 8px 12px; margin-bottom: 12px; }
}

/* Landscape phones: the keyboard leaves ~200px. Put Sign in on the password
 * row: the browser always scrolls the focused field into view, and the button
 * comes with it, whether the keyboard resizes or overlays the page. */
@media (max-height: 500px) and (orientation: landscape) {
  .login-card { max-width: 640px; padding: 12px 20px; margin-top: 8px; }
  #login-form { display: grid; grid-template-columns: 1fr 1fr auto; column-gap: 12px; }
  #login-form label[for="username"] { grid-area: 1 / 1; }
  #login-form label[for="password"] { grid-area: 1 / 2; }
  #username { grid-area: 2 / 1; }
  #password { grid-area: 2 / 2; }
  #submit-btn { grid-area: 2 / 3; width: auto; }
  input[type="text"], input[type="password"] { margin-bottom: 0; }
}

/* Small phones (iPhone SE 1st gen): the subtitle costs the button its place above the keyboard */
@media (max-height: 600px) {
  .login-card p { display: none; }
  .login-card h1 { margin-bottom: 12px; }
}

button[type="submit"] { min-height: 44px; }

#error-msg {
  background: #7f1d1d;
  color: #fca5a5;
  font-size: 13px;
  padding: 8px 12px;
  border-radius: 4px;
  margin-bottom: 16px;
  display: none;
}
</style>
</head>
<body>

<div class="login-card">
  <h1>Election Stream Monitor</h1>
  <p>Sign in to continue</p>

  <div id="error-msg"></div>

  <form id="login-form">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" enterkeyhint="go" required>

    <button type="submit" id="submit-btn">Sign in</button>
  </form>
</div>

<script>
const form = document.getElementById('login-form');
const errorMsg = document.getElementById('error-msg');
const submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.style.display = 'none';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Signing in…';

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });

    if (res.ok) {
      const data = await res.json();
      window.location.href = data.role === 'admin' ? '/admin' : '/';
    } else {
      const data = await res.json();
      errorMsg.textContent = data.error || 'Login failed';
      errorMsg.style.display = 'block';
    }
  } catch (err) {
    errorMsg.textContent = 'Network error. Please try again.';
    errorMsg.style.display = 'block';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign in';
  }
});

// Keep the Sign in button above the on-screen keyboard. Presentational only:
// once the keyboard opens (visual viewport shrinks) or a field gets focus,
// scroll the button into view if it is hidden.
(function () {
  const reveal = () => {
    const a = document.activeElement;
    if (a && a.form === form) submitBtn.scrollIntoView({ block: 'nearest' });
  };
  if (window.visualViewport) window.visualViewport.addEventListener('resize', reveal);
  form.addEventListener('focusin', () => setTimeout(reveal, 350));
})();
</script>
</body>
</html>

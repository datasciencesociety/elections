################################################################################
# /etc/nginx/conf.d/hls-http-settings-no-cf.conf
# Drop-in http-context additions for bare-metal installs (no Cloudflare).
# Safe alongside an existing nginx — only adds new named zones, does not
# override any global defaults that could affect other vhosts.
################################################################################

proxy_cache_path  /var/cache/nginx/hls
    levels=1:2
    keys_zone=HLS:50m
    max_size=1g
    inactive=60s
    use_temp_path=off;

proxy_cache_key  "$request_uri";

# Archive MP4s (archive.evideo.bg), cached as 1 MB slices for a day: the test
# video every volunteer plays. Only the archive location in hls-proxy.conf uses it.
proxy_cache_path  /var/cache/nginx/archive
    levels=1:2
    keys_zone=ARCHIVE:10m
    max_size=1g
    inactive=24h
    use_temp_path=off;

# Never cache an empty playlist (a restarting stream answers 200 with no body).
# Works only when the origin sends Content-Length: 0; a chunked empty body is
# still held for the 2 s playlist TTL.
map $upstream_http_content_length $no_cache_empty {
    default 0;
    "0"     1;
}

# Public DNS — required for dynamic proxy_pass with variables
resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;

# Send SNI when connecting to upstream — required for Cloudflare-hosted origins
proxy_ssl_server_name on;

# Rate-limit zone — 300 req/min per client IP, burst 50
limit_req_zone $binary_remote_addr zone=hls_rate:10m rate=5000r/s;

################################################################################
# /etc/nginx/conf.d/hls-proxy.conf
# URL scheme: /{hostname}/{path} → https://{hostname}/{path}
# Only evideo.bg and subdomains are allowed.
################################################################################

server {
    listen      8666;
    server_name _;

    # Local only: the public site reaches this proxy over 127.0.0.1. Port 8666 listens on every
    # interface, so without this anyone could send requests to evideo from this server's address.
    # Server-level, so it runs before every location (healthz, preflight and return included).
    if ($remote_addr != "127.0.0.1") {
        return 403 "local only\n";
    }

    # Proxy performance — scoped here to avoid affecting other vhosts
    proxy_http_version      1.1;
    proxy_set_header        Connection        "";
    proxy_connect_timeout   5s;
    proxy_send_timeout      15s;
    proxy_read_timeout      30s;
    proxy_buffer_size       16k;
    proxy_buffers           8  64k;
    proxy_busy_buffers_size 128k;

    # Reject non-standard HTTP methods
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    location = /healthz {
        access_log off;
        return 200 "OK\n";
    }

    # Archive MP4s (host exactly archive.evideo.bg) — cached in 1 MB slices for 24 h.
    # Every volunteer plays the same test video; uncached, each viewer's range
    # requests would reach evideo from this one IP and Cloudflare would block it.
    # First regex location, so an .mp4 path that the playlist or segment pattern
    # would also match still lands here. Other hosts' MP4s stay passthrough.
    location ~ ^/(archive\.evideo\.bg)(/.+\.mp4)$ {
        limit_req zone=hls_rate burst=10000 nodelay;
        include /etc/nginx/conf.d/_cors_preflight.inc;
        set $ups_host $1;
        set $ups_path $2;
        proxy_pass https://$ups_host$ups_path$is_args$args;
        proxy_set_header Host $ups_host;
        include /etc/nginx/conf.d/_proxy_headers.inc;
        include /etc/nginx/conf.d/_cors_headers.inc;
        # Each 1 MB slice is fetched and cached on its own; a client Range
        # (seeking) is answered from the slices it covers
        slice                   1m;
        proxy_set_header        Range $slice_range;
        proxy_set_header        Accept-Encoding "";
        proxy_cache             ARCHIVE;
        proxy_cache_key         $scheme$ups_host$uri$slice_range;
        proxy_cache_valid       200 206 24h;
        proxy_cache_lock        on;
        # A lock that times out sends every waiting viewer to evideo at once
        proxy_cache_lock_timeout 10s;
        proxy_cache_lock_age    10s;
        proxy_ignore_headers    Cache-Control Expires X-Accel-Expires Set-Cookie Vary;
        # Would be stored with the slice and replayed to every viewer
        proxy_hide_header       Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # .m3u8 playlists — 2 s cache, browser must not cache
    location ~ ^/((?:[a-z0-9-]+\.)*evideo\.bg)(/.+\.m3u8.*)$ {
        limit_req zone=hls_rate burst=10000 nodelay;
        include /etc/nginx/conf.d/_cors_preflight.inc;
        set $ups_host $1;
        set $ups_path $2;
        proxy_pass https://$ups_host$ups_path$is_args$args;
        proxy_set_header Host $ups_host;
        include /etc/nginx/conf.d/_proxy_headers.inc;
        include /etc/nginx/conf.d/_cors_headers.inc;
        proxy_cache             HLS;
        proxy_cache_valid       200 2s;
        proxy_cache_valid       206 2s;
        # Our 2 s wins over the origin's max-age (index.m3u8 comes with max-age=30)
        proxy_ignore_headers    Cache-Control Expires X-Accel-Expires;
        proxy_hide_header       Cache-Control;
        # Never cache an empty playlist; keep no "updating" in use_stale and
        # background_update off, so an empty or old playlist cannot stick
        proxy_no_cache          $no_cache_empty;
        proxy_cache_use_stale   error timeout invalid_header;
        proxy_cache_background_update off;
        proxy_cache_lock        on;
        proxy_cache_lock_timeout 2s;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Upstream-Response-Time $upstream_response_time always;
        add_header Cache-Control "no-store" always;
    }

    # .ts / .m4s segments — 20 s cache
    location ~ ^/((?:[a-z0-9-]+\.)*evideo\.bg)(/.+\.(ts|m4s).*)$ {
        limit_req zone=hls_rate burst=10000 nodelay;
        include /etc/nginx/conf.d/_cors_preflight.inc;
        set $ups_host $1;
        set $ups_path $2;
        proxy_pass https://$ups_host$ups_path$is_args$args;
        proxy_set_header Host $ups_host;
        include /etc/nginx/conf.d/_proxy_headers.inc;
        include /etc/nginx/conf.d/_cors_headers.inc;
        proxy_cache             HLS;
        proxy_cache_valid       200 20s;
        proxy_cache_valid       206 20s;
        # Our 20 s wins over the origin's cache headers
        proxy_ignore_headers    Cache-Control Expires X-Accel-Expires;
        proxy_hide_header       Cache-Control;
        proxy_cache_use_stale   error timeout updating;
        proxy_cache_background_update on;
        proxy_cache_lock        on;
        proxy_cache_lock_timeout 5s;
        proxy_set_header Range "";
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Upstream-Response-Time $upstream_response_time always;
        add_header Cache-Control "public, max-age=20" always;
    }

    # Everything else (.mp4, AES keys, init segments, etc.) — pure passthrough, no buffering/cache
    # MP4 files need range requests to work; buffering and caching break seeking.
    location ~ ^/((?:[a-z0-9-]+\.)*evideo\.bg)(/.+)$ {
        limit_req zone=hls_rate burst=10000 nodelay;
        include /etc/nginx/conf.d/_cors_preflight.inc;
        set $ups_host $1;
        set $ups_path $2;
        proxy_pass https://$ups_host$ups_path$is_args$args;
        proxy_set_header Host $ups_host;
        include /etc/nginx/conf.d/_proxy_headers.inc;
        include /etc/nginx/conf.d/_cors_headers.inc;
        proxy_buffering  off;
        proxy_cache      off;
        add_header X-Cache-Status BYPASS always;
    }

    # Reject anything that doesn't match /{evideo-host}/path
    location / {
        return 403 "Invalid proxy path\n";
    }
}

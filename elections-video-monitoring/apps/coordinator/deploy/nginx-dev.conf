# Local dev: the live /hls proxy in front of a coordinator running on the host.
# Run with scripts/dev-nginx.sh, then open http://localhost:8080 (PROXY_URL=http://localhost:8080/hls).

limit_req_zone $binary_remote_addr zone=coord_hls:10m rate=20r/s;

server {
    listen      8080;
    server_name localhost;
    # Same resolvers as the live site. Not Docker's 127.0.0.11: it exists only on user-defined networks
    resolver    1.1.1.1 8.8.8.8 ipv6=off valid=300s;
    resolver_timeout 5s;

    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header   Host              $http_host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    include /etc/nginx/coordinator-hls.conf;

    location / {
        proxy_pass http://host.docker.internal:@PORT@;
    }
}

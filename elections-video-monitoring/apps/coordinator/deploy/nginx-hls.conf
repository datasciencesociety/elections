# Same-origin HLS proxy: /hls/{host}/{path} → https://{host}/{path}, evideo.bg hosts only.
# Included by nginx-site.conf (live) and nginx-dev.conf (local), so dev runs the same proxy.
# The including file must define `resolver` and, at http level, the `coord_hls` limit_req zone.
# Set PROXY_URL=https://<domain>/hls on the coordinator.

location = /hls/healthz {
    access_log off;
    default_type text/plain;
    return 200 "OK\n";
}

location ~ ^/hls/(?<hls_host>(?:[a-z0-9-]+\.)*evideo\.bg)(?<hls_path>/.*)$ {
    # Only pages with a login cookie. nginx cannot check its signature (asking Node per segment
    # would cost ~1 request/s per card), so this stops casual reuse, not a determined user.
    if ($cookie_session = "") { return 401; }
    limit_except GET { deny all; }
    # One card makes ~45 requests/min and volunteers on one Wi-Fi share an IP
    limit_req zone=coord_hls burst=150 nodelay;

    proxy_pass https://$hls_host$hls_path$is_args$args;
    proxy_ssl_server_name on;
    proxy_ssl_name        $hls_host;
    proxy_http_version    1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    # Stream through: MP4 range requests and live segments must not wait for a full buffer
    proxy_buffering off;

    # Defining headers here drops the server-level X-Forwarded-* set; evideo gets only these
    proxy_set_header Host       $hls_host;
    proxy_set_header Connection "";
    proxy_set_header Cookie     "";
    proxy_set_header User-Agent "Mozilla/5.0";
    proxy_set_header Referer    "https://evideo.bg/";

    proxy_hide_header Set-Cookie;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Strict-Transport-Security;
}

location /hls/ { return 403; }

# Same-origin HLS proxy: /hls/{host}/{path} → https://{host}/{path}, evideo.bg hosts and media files only.
# Included by nginx-site.conf (live) and nginx-dev.conf (local), so dev runs the same proxy.
# The including file must define `resolver`, `proxy_cache_path ... keys_zone=coord_hls_cache`
# and include nginx-hls-http.conf at http level.
# Set PROXY_URL=/hls on the coordinator (relative: works on any domain that serves the site).
#
# Emergency switch, no reload: `touch /etc/nginx/coordinator-hls-off` answers 410, and volunteer
# cards fall back to playing evideo directly (no detection). `rm` the file to switch back.

location = /hls/healthz {
    access_log off;
    default_type text/plain;
    # @RELEASE@ is filled in by remote-install.sh; deploy waits until nginx serves it
    return 200 "OK @RELEASE@";
}

location ~ ^/hls/(?<hls_host>(?:[a-z0-9-]+\.)*evideo\.bg)(?<hls_path>/[^\s]*\.(?:m3u8|ts|m4s|mp4|m4a|aac|key|vtt))$ {
    # Only pages with a well-formed login cookie (<base64url>.<hex hmac>). nginx cannot check the
    # signature (asking Node per segment would cost ~1 request/s per card), so this stops casual reuse.
    if ($cookie_session !~ "^[A-Za-z0-9_-]+\.[0-9a-f]{64}$") { return 401; }
    if (-f /etc/nginx/coordinator-hls-off) { return 410; }
    limit_except GET { deny all; }
    limit_req zone=coord_hls burst=150 nodelay;
    # 429, not the default 503: the volunteer page retries 429 and treats other failures as broken
    limit_req_status 429;
    access_log /var/log/nginx/access.log combined if=$coord_hls_log;

    proxy_pass https://$hls_host$hls_path$is_args$args;
    proxy_ssl_server_name on;
    proxy_ssl_name        $hls_host;
    proxy_http_version    1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    # Buffer in memory only (caching needs buffering); larger responses such as MP4s stream through
    proxy_max_temp_file_size 0;

    proxy_cache            coord_hls_cache;
    proxy_cache_key        $hls_host$hls_path$is_args$args;
    proxy_no_cache         $coord_hls_nocache;
    proxy_cache_bypass     $coord_hls_nocache;
    proxy_cache_valid      200 2s;
    proxy_cache_lock       on;
    proxy_cache_use_stale  updating;
    proxy_ignore_headers   Cache-Control Expires Set-Cookie;

    # Defining headers here drops the server-level X-Forwarded-* set; evideo gets only these
    proxy_set_header Host       $hls_host;
    proxy_set_header Connection "";
    proxy_set_header Cookie     "";
    proxy_set_header User-Agent "Mozilla/5.0";
    proxy_set_header Referer    "https://evideo.bg/";

    proxy_hide_header Set-Cookie;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Strict-Transport-Security;

    # Whatever evideo serves here must never run as a page on our origin. add_header here replaces the
    # server-level set, so it is repeated
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;
}

location /hls/ { return 403; }

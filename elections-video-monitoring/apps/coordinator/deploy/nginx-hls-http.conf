# http-level part of the /hls proxy (nginx-hls.conf), included by nginx-site.conf and nginx-dev.conf.
# The including file also sets `proxy_cache_path ... keys_zone=coord_hls_cache` (paths differ per image).

# One card makes ~45 requests/min and volunteers on one Wi-Fi share an IP
limit_req_zone $binary_remote_addr zone=coord_hls:10m rate=20r/s;

# Cache playlists only: each segment has one viewer, but the card and the inspect panel poll the same playlist
map $uri $coord_hls_nocache {
    ~\.m3u8$ 0;
    default  1;
}

# Log failures only: at 1,000 cards every segment would be ~750 lines/s
map $status $coord_hls_log {
    ~^[23]  0;
    default 1;
}

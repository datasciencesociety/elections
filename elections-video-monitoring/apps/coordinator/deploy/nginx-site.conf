# Installed by deploy.sh as /etc/nginx/sites-available/election-coordinator; @DOMAIN@ is filled in.
# TLS certificate: certbot certonly --webroot -w /var/www/html -d @DOMAIN@

# Volunteers log in from shared Wi-Fi, so the per-IP login limit stays generous.
# Each login costs ~50 ms of blocking bcrypt CPU, so a global cap bounds the total (~0.5 core).
limit_req_zone $binary_remote_addr zone=coord_login:10m rate=30r/m;
limit_req_zone $server_name        zone=coord_login_all:1m rate=10r/s;

server {
    listen      80;
    listen      [::]:80;
    server_name @DOMAIN@;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name @DOMAIN@;

    ssl_certificate     /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Bulk stream upload (~3 MB for 12k sections); server.js rejects bodies over 20 MB
    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    location = /api/login {
        limit_req zone=coord_login burst=30 nodelay;
        limit_req zone=coord_login_all burst=20;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:@PORT@;
    }

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
    }
}
